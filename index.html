<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0F5F63"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OKA"><meta name="apple-mobile-web-app-status-bar-style" content="default"><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}</script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>OKA One Knock Away</title>

<style>
/* Layout: one column (phone) for Band and Visitor views, wider two-column page for the Nurse view. Public-service look, high legibility. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --fg:#1B2430; --muted:#4F5966; --line:#DCD7CB;
  --brand:#0F5F63; --brand-soft:#E1EDEC; --on-brand:#FFFFFF;
  --red:#A3201A; --amber:#94470A; --green:#2F6B3B; --blue:#1F4E9A; --on-status:#FFFFFF;
  --amber-soft:#FBEBD8; --amber-ink:#6E3504; --green-soft:#E3EFE5; --green-ink:#2A5F35; --red-soft:#F9E3E1; --red-ink:#7E1813; --blue-soft:#E3EAF7; --blue-ink:#1F3F7A;
  --font:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171B; --surface:#1B242A; --fg:#E8ECEE; --muted:#A7B1B9; --line:#2D3940;
  --brand:#6DBDBA; --brand-soft:#16302F; --on-brand:#0A1C1D;
  --red:#C2362D; --amber:#B0600F; --green:#3D8049; --blue:#5B8BD9; --on-status:#FFFFFF;
  --amber-soft:#3A2915; --amber-ink:#F2C48F; --green-soft:#1C3222; --green-ink:#A3D6AC; --red-soft:#3C1A18; --red-ink:#F5ADA7; --blue-soft:#18253B; --blue-ink:#A9C3F0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171B; --surface:#1B242A; --fg:#E8ECEE; --muted:#A7B1B9; --line:#2D3940;
  --brand:#6DBDBA; --brand-soft:#16302F; --on-brand:#0A1C1D;
  --red:#C2362D; --amber:#B0600F; --green:#3D8049; --blue:#5B8BD9; --on-status:#FFFFFF;
  --amber-soft:#3A2915; --amber-ink:#F2C48F; --green-soft:#1C3222; --green-ink:#A3D6AC; --red-soft:#3C1A18; --red-ink:#F5ADA7; --blue-soft:#18253B; --blue-ink:#A9C3F0;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45}
*{box-sizing:border-box}
button,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column}
.app.wide{max-width:1100px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.viewbar{display:flex;gap:6px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.viewbar button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:15px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.viewbar button small{font-weight:400;font-size:12px;color:var(--muted)}
.viewbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.viewbar button[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:var(--on-status);font-size:12px;margin-left:4px}
header.top{background:var(--brand);color:var(--on-brand);padding-block:16px 14px;display:flex;align-items:center;gap:12px}
header.top .brand{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
header.top h1{margin:0;font-size:23px;line-height:1.15;text-wrap:balance}
header.top .sub{font-size:15px;opacity:.9}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
main{flex:1;padding-block:16px 28px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);min-width:0}
button.card{text-align:left;cursor:pointer;width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-size:18px;font-weight:700}
.muted{color:var(--muted);font-size:15px}
.small{font-size:14px}
h2.h2{margin:0;font-size:19px}
h3{margin:0;font-size:16px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.todo{background:var(--line);color:var(--fg)}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pill{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bandvis{display:flex;align-items:center;gap:14px}
.band{width:64px;height:64px;border-radius:20px;background:var(--fg);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.band .dot{width:18px;height:18px;border-radius:999px;background:#3BA55C}
.band.alert .dot{background:#E5483D;animation:blink 1s infinite}
.band.off .dot{background:#888}
@keyframes blink{50%{opacity:.25}}
.scen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.scen button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;text-align:left;padding:8px 12px;line-height:1.25}
.scen button b{display:block;font-size:15px}
.scen button span{font-size:13px;color:var(--muted)}
.hero{border-radius:14px;padding:16px;color:var(--on-status);display:flex;flex-direction:column;gap:6px}
.hero.red{background:var(--red)}.hero.amber{background:var(--amber)}.hero.green{background:var(--green)}.hero.blue{background:var(--blue)}
.hero .lvl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero h2{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.hero p{margin:0;font-size:16px}
.tl{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tl li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.tl li .t{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--muted);width:44px}
.btn{min-height:48px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;padding:0 16px;width:100%}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.plain{background:var(--surface);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:var(--on-status)}
.btn.ghost{background:var(--green-soft);color:var(--green-ink)}
.btn.sm{min-height:44px;font-size:15px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.req{border:2px solid var(--amber)}
.req.urgent{border-color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.tag[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px;font-size:16px;resize:vertical}
label.lbl{font-size:15px;font-weight:700}
.mic{width:96px;height:96px;border-radius:999px;border:0;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;cursor:pointer;align-self:center}
.mic.rec{background:var(--red)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.ncol{display:flex;flex-direction:column;gap:12px;min-width:0}
.frow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 2em;gap:10px;align-items:center;font-size:15px}
.fbar{height:12px;background:var(--bg);border-radius:999px;overflow:hidden}
.ffill{display:block;height:100%;border-radius:999px}
.ffill.green{background:var(--green)}.ffill.amber{background:var(--amber)}.ffill.red{background:var(--red)}.ffill.blue{background:var(--blue)}.ffill.muted{background:var(--muted)}
.fnum{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ho{font-size:15px;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:20}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
@media (prefers-reduced-motion: reduce){.band.alert .dot{animation:none}}
</style>

<div class="app" id="app">
  <div class="viewbar gut" role="group" aria-label="Demo view">
    <button type="button" id="vb-band" data-view="band">Band<small>what happens</small></button>
    <button type="button" id="vb-visitor" data-view="visitor">Visitor<small>postie app</small></button>
    <button type="button" id="vb-nurse" data-view="nurse">Nurse team<small>queue</small></button>
  </div>
  <header class="top gut" id="hdr"></header>
  <main class="gut" id="screen" aria-live="polite"></main>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function(){
  // ---------- Fictional residents (match the agent's knowledge file) ----------
  var R = [
    {id:'DS-001', name:'Mrs Asha Patel', short:'Mrs Patel', age:84, addr:'12 Elm Road', usual:'Walks to the corner shop most days', steps:4000, hr:68, sleep:7, wake:'07:00', thinners:true, af:false,
      record:'High blood pressure. Takes blood thinners.', key:'daughter Priya Patel', visitor:'Postie (round ~10:30)', plans:''},
    {id:'DS-002', name:'Mr Daniel Okafor', short:'Mr Okafor', age:79, addr:'3 Mill Lane', usual:'Hard of hearing, waves from the kitchen window', steps:3000, hr:74, sleep:7, wake:'06:00', thinners:false, af:false,
      record:'Type 2 diabetes. Hard of hearing.', key:'neighbour Joan Price (5 Mill Lane)', visitor:'Postie (round ~9:00)', plans:''},
    {id:'DS-003', name:'Mrs June Hughes', short:'Mrs Hughes', age:91, addr:'Flat 4, Rose Court', usual:'At the window by 10am, walks with a frame', steps:1500, hr:72, sleep:8, wake:'08:00', thinners:false, af:false,
      record:'Two falls in the last year. Often forgets the band after a shower.', key:'daughter Carol Hughes', visitor:'Postie (round ~11:00), Rose Court warden', plans:'Often stays with her daughter without telling anyone'},
    {id:'DS-004', name:'Mrs Halina Nowak', short:'Mrs Nowak', age:87, addr:'27 Station Street', usual:'Sharp, does the crossword, speaks Polish', steps:4500, hr:70, sleep:7, wake:'07:00', thinners:false, af:false,
      record:'No memory problems recorded.', key:'son Marek Nowak', visitor:'Pharmacy driver (Tue & Fri), postie (~12:00)', plans:'Polish club on Wednesdays'},
    {id:'DS-005', name:'Mr Kiran Shah', short:'Mr Shah', age:76, addr:'9 Elm Road', usual:'Cooks for himself, cheerful', steps:5000, hr:76, sleep:7, wake:'06:30', thinners:false, af:false,
      record:'COPD (lung condition).', key:'no key holder', visitor:'Postie (round ~10:45)', plans:'Day centre on Thursdays'},
    {id:'DS-007', name:'Mr Tom Williams', short:'Mr Williams', age:82, addr:'8 Elm Road', usual:'Gardens every morning', steps:6000, hr:64, sleep:7, wake:'06:00', thinners:false, af:false,
      record:'Nothing relevant. No known irregular heartbeat.', key:'son Gareth Williams', visitor:'Postie (round ~10:40)', plans:''},
    {id:'DS-008', name:'Mr George Turner', short:'Mr Turner', age:93, addr:'2 Bell Lane', usual:'Slow to the door (2-3 min is normal), very sharp', steps:1200, hr:66, sleep:9, wake:'08:00', thinners:false, af:false,
      record:'Walking stick, poor eyesight.', key:'neighbour Ali Hassan (4 Bell Lane)', visitor:'Postie (round ~9:30)', plans:''},
    {id:'DS-010', name:'Mr Arthur Price', short:'Mr Price', age:89, addr:'1 Bell Lane', usual:'Wears hearing aids, likes a chat', steps:2500, hr:78, sleep:8, wake:'07:30', thinners:true, af:true,
      record:'KNOWN irregular heartbeat (atrial fibrillation). Takes blood thinners.', key:'daughter Linda Price', visitor:'Postie (round ~9:35)', plans:''}
  ];
  function res(id){ for (var i=0;i<R.length;i++) if (R[i].id===id) return R[i]; }

  // ---------- Scenarios the band can send (demo) ----------
  var SCEN = [
    {k:'fallOk', t:'Fall, presses "I\'m OK"', s:'Short press after the fall'},
    {k:'fallHelp', t:'Fall, can\'t get up', s:'Long press: needs help'},
    {k:'fallNone', t:'Fall, no response', s:'No press, no movement'},
    {k:'decline', t:'Quiet decline', s:'Fewer steps, more sleep, missed pills'},
    {k:'af', t:'Irregular heartbeat', s:'Rhythm alert, feels fine'},
    {k:'hot', t:'Hot day', s:'Drink reminders ignored, high pulse'},
    {k:'notWorn', t:'Band not worn', s:'No data for 13 hours'},
    {k:'sos', t:'SOS: chest pain', s:'Long press + "pain in my chest"'}
  ];

  // ---------- State ----------
  var S = {view:'band', sel:'DS-001', alerts:[], seq:0, slots:4, teamFull:false, vscreen:'round', vcur:null, vtags:[], vnote:'', copyText:null, rec:false};
  var toastT = null, recog = null;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  try { localStorage.removeItem('doorstep-band-demo'); } catch(e) {}

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return (n<10?'0':'')+n; }
  function clock(offMin){ var d = new Date(Date.now()+(offMin||0)*60000); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; },3200); }
  function header(title, sub, back){
    $('hdr').innerHTML = (back?'<button type="button" class="iconbtn" id="hdr-back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>':'')+
      '<div><div class="brand">OKA \u00b7 One Knock Away</div><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>';
    if (back) $('hdr-back').onclick = back;
  }
  function recentConcern(r){ return S.alerts.some(function(a){ return a.res===r.id && a.score>0; }); }
  function knockOpen(){ return S.alerts.filter(function(a){ return a.knock && !a.knockDone && !a.closed; }); }

  // ---------- Triage engine (same rules as the Copilot agent, simplified) ----------
  function makeAlert(r, k){
    var a = {id:++S.seq, res:r.id, k:k, time:clock(0), why:[], score:0, log:[], knock:false, knockUrgent:false, knockDone:false, closed:false, outcome:null};
    function add(label, pts){ a.score += pts; a.why.push(label+' +'+pts); }
    function mods(){
      if (a.score>0){
        if (r.age>=85) add('Aged 85+',1);
        if (recentConcern(r)) add('Earlier concern this week',1);
      }
    }
    function scoreRoute(){
      if (a.score>=4){ bookVisit(a); }
      else if (a.score>=2){ a.level='amber'; a.route='call'; a.title='Nurse phone call today'; }
      else if (a.score===1){ a.level='green'; a.route='watch'; a.title='Watch: next visitor checks'; a.knock=true; }
      else { a.level='green'; a.route='noted'; a.title='Noted, normal for them'; }
    }
    var lines = [];
    if (k==='fallOk'){
      lines = [a.time+' fall detected', 'Pressed "I\'m OK" after 40 seconds', 'Moving since (35 steps)'];
      a.signal='Fall detected, pressed "I\'m OK"';
      add('Fall, responded',2); if (r.thinners) add('Blood thinners and a fall',1); mods(); scoreRoute();
      if (a.route==='watch'||a.route==='noted'){ a.level='amber'; a.route='call'; a.title='Nurse phone call today'; }
      a.knock=true; a.followUp='Did they hit their head? If yes on blood thinners: 999.';
      a.log.push([a.time,'Band: vibrates, red light, "Are you OK?"'],[a.time,'Short press: "I\'m OK"'],[a.time,'Nurse call added to the queue'],[a.time,'Knock request sent to '+r.visitor.split(',')[0]],[a.time,'Text to '+r.key]);
    } else if (k==='fallHelp'){
      lines = [a.time+' fall detected', 'Long press: "I need help"', 'Not badly hurt, can\'t get up'];
      a.signal='Fall, long press: can\'t get up';
      a.level='amber'; a.route='pickup'; a.title='Falls pick-up team within 1 hour';
      a.knock=true; a.knockUrgent=true;
      a.log.push([a.time,'Long press: "I need help"'],[a.time,'Elmside Falls Pick-up Service booked (aim: 1 hour)'],[a.time,'Call to '+r.key],[a.time,'Nearest visitor asked to knock and stay outside until help arrives']);
    } else if (k==='fallNone'){
      lines = [a.time+' fall detected', 'No press after 60 seconds', 'No movement since'];
      a.signal='Fall, no response, no movement';
      a.level='amber'; a.route='ladder'; a.title='Fall ladder: checking now, 999 at '+clock(15);
      a.deadline=clock(15); a.knock=true; a.knockUrgent=true;
      a.log.push([a.time,'No press, no movement'],[a.time,'Calling '+r.short],[a.time,'Calling '+r.key],[a.time,'Nearest visitor asked to knock now'],[clock(15),'999 if still no movement']);
    } else if (k==='decline'){
      lines = ['Steps: 900 yesterday, 600 today (usual '+r.steps.toLocaleString('en-GB')+')', 'Slept '+(r.sleep+4)+'h two nights (usual '+r.sleep+'h)', 'Medication reminder missed 2 days'];
      a.signal='Quiet decline over 2 days';
      add('Steps less than half of usual',2); add('Sleep 3h+ more than usual',1); add('Medication reminders missed',1); mods(); scoreRoute();
      if (a.route==='visit'||a.route==='review') a.log.push([a.time,'Pattern spotted over 2 days'],[a.time,a.route==='visit'?'Nurse visit booked today':'Team full: senior nurse reviews'],[a.time,'Text to '+r.key]);
      else a.log.push([a.time,'Pattern spotted over 2 days'],[a.time,'Nurse call added']);
    } else if (k==='af'){
      lines = ['Irregular heart rhythm alert at '+a.time, 'Steps normal today', 'Check-in: short press, feels fine'];
      a.signal='Irregular heart rhythm';
      if (r.af){ a.level='green'; a.route='noted'; a.title='Noted: known irregular heartbeat'; a.why.push('Known atrial fibrillation in record, expected for them'); a.log.push([a.time,'Known AF in record: no action']); }
      else { a.level='blue'; a.route='gp'; a.title='GP appointment within 2 days'; a.why.push('New irregular rhythm, no symptoms: stroke risk to check, not an emergency'); a.log.push([a.time,'GP practice asked for an appointment within 2 days'],[a.time,'Text to '+r.key]); }
    } else if (k==='hot'){
      lines = ['Temperature today 31°C', 'Drink reminders 10:00, 12:00, 14:00 not confirmed', 'Resting pulse '+Math.round(r.hr*1.3)+' since 13:00 (usual '+r.hr+')'];
      a.signal='Hot day: drink reminders ignored, high pulse';
      add('Drink reminders ignored on a hot day',1); add('Pulse 25%+ above usual for 2h',2); mods(); scoreRoute();
      a.why.push('Note: the band cannot measure dehydration, it spots warning signs');
      a.log.push([a.time,'Pattern spotted'],[a.time,a.route==='call'?'Nurse call added':'Nurse visit booked']);
    } else if (k==='notWorn'){
      lines = ['Band not worn since 21:30 yesterday', 'Now '+a.time+', no data'];
      a.signal='Band not worn for 13 hours';
      a.level='amber'; a.route='check'; a.title='Visitor check first, no nurse yet';
      a.knock=true; a.deadline=clock(r.age>=90?60:120);
      var first = r.plans ? 'Call '+r.key+' first ('+r.plans.toLowerCase()+')' : 'Call '+r.short;
      a.log.push([a.time,'Check known plans'],[a.time,first],[a.time,'Knock request sent to '+r.visitor.split(',')[0]],[a.deadline,'Nurse visit if no one reaches them']);
    } else if (k==='sos'){
      lines = ['SOS long press at '+a.time, 'Voice: "I have pain in my chest"'];
      a.signal='SOS: chest pain';
      a.level='red'; a.route='999'; a.title='Call 999 now';
      a.why.push('Chest pain = red flag. The band does not detect heart attacks; the person told us.');
      a.log.push([a.time,'999 called'],[a.time,'Urgent community team told'],[a.time,'Call to '+r.key+' to open the door']);
    }
    a.lines = lines;
    a.band = 'BAND ALERT. '+r.name+' (band '+r.id+'). '+lines.join('. ')+'. Now '+a.time+'.';
    return a;
  }
  function bookVisit(a){
    if (S.teamFull || S.slots<=0){ a.level='amber'; a.route='review'; a.title='Senior nurse review (team full)'; }
    else { S.slots--; a.level='amber'; a.route='visit'; a.title='Nurse visit today'; }
  }

  function trigger(k){
    var r = res(S.sel), a = makeAlert(r, k);
    S.alerts.unshift(a); S.last = a.id;
    render(); var el=$('result'); if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
    toast(a.knock ? 'Alert handled. A knock request went to the visitor app.' : 'Alert handled.');
  }
  function byId(id){ for (var i=0;i<S.alerts.length;i++) if (S.alerts[i].id===id) return S.alerts[i]; }

  // ---------- Ladder actions ----------
  function ladderResolve(a, how){
    var r = res(a.res);
    if (how==='found'){
      a.closed=true; a.knockDone=true; a.level='green'; a.route='resolved';
      a.title = a.k==='notWorn' ? 'Resolved: '+(r.plans?'staying with family':'reached, forgot the band') : 'Resolved: reached, up and OK';
      a.log.push([clock(0), a.k==='notWorn'&&r.plans ? r.key+': "She\'s with me this week"' : 'Reached by phone, OK']);
      if (a.k==='fallNone'){ a.level='amber'; a.route='call'; a.title='Up and OK: nurse phone call today'; a.closed=false; }
      toast('Resolved without an ambulance');
    } else {
      if (a.k==='fallNone'){ a.level='red'; a.route='999'; a.title='Call 999 now'; a.log.push([a.deadline||clock(0),'Still no movement after 15 min: 999 called']); a.knockDone=true; }
      else { bookVisit(a); a.log.push([a.deadline||clock(0),'No one reached them: '+a.title.toLowerCase()]); }
      toast('Escalated');
    }
    render();
  }

  // ---------- Visitor report on a knock request ----------
  function visitorReport(a, what){
    var r = res(a.res); a.knockDone = true;
    if (what==='fine'){
      a.log.push([clock(0),'Visitor: seen, looks OK']);
      if (a.route==='watch'||a.route==='check'){ a.closed=true; a.level='green'; a.route='resolved'; a.title='Resolved: seen by visitor, OK'; }
    } else if (what==='noanswer'){
      a.log.push([clock(0),'Visitor: no answer at the door']);
      if (a.route==='check'||a.route==='watch'||a.route==='call'){ bookVisit(a); a.log.push([clock(0),a.title]); }
    } else if (what==='floor'){
      a.log.push([clock(0),'Visitor: on the floor, not responding. 999 called']);
      a.level='red'; a.route='999'; a.title='Call 999 now';
    } else if (what==='worse'){
      a.log.push([clock(0),'Visitor: seems worse than usual (note sent)']);
      if (a.route!=='999') bookVisit(a);
    }
    S.vscreen='round'; render(); toast('Report sent. Thank you.');
  }

  // ---------- Handover + copy ----------
  function handover(a){
    var r = res(a.res);
    return [
      ['Situation', a.lines.join('. ')+'.'],
      ['Background', r.age+', lives alone, '+r.addr+'. '+r.record+' Key holder: '+r.key+'.'],

    ];
  }
  function copyFor(a){
    var text = a.band;
    function fallback(){ S.copyText=text; render(); var b=$('copybox'); if(b){ b.focus(); b.select(); } toast('Select the text and copy it'); }
    try { navigator.clipboard.writeText(text).then(function(){ toast('Copied. Paste it into the OKA Care Agent in Copilot.'); }, fallback); } catch(e){ fallback(); }
  }
  function copyBox(){ return S.copyText ? '<section class="card"><label class="lbl" for="copybox">Text for the OKA Care Agent</label><textarea id="copybox" readonly style="min-height:110px;font-size:14px">'+esc(S.copyText)+'</textarea></section>' : ''; }

  // ---------- Render ----------

    var q = S.alerts.filter(function(a){ return !a.closed && !a.outcome && ['call','visit','review','pickup','999','ladder','gp'].indexOf(a.route)>=0; }).length;
    $('vb-nurse').innerHTML = 'Nurse team'+(q?'<span class="badge">'+q+'</span>':'')+'<small>queue</small>';
    $('app').classList.toggle('wide', S.view==='nurse');
    if (S.view==='band') rBand(); else if (S.view==='visitor') rVisitor(); else rNurse();

  function heroFor(a){

    return '<div class="hero '+a.level+'" id="result" style="scroll-margin-top:72px"><span class="lvl">'+lvlWord+' · '+esc(a.signal)+'</span><h2>'+esc(a.title)+'</h2></div>';

  function rBand(){

      '<div class="stats"><div class="stat"><b>'+r.steps.toLocaleString('en-GB')+'</b><span>usual steps a day</span></div><div class="stat"><b>'+r.hr+'</b><span>usual resting pulse</span></div><div class="stat"><b>'+r.sleep+'h</b><span>usual sleep</span></div><div class="stat"><b>'+esc(r.wake)+'</b><span>usually up by</span></div></div>'+

        '<section class="card"><h3>What OKA did</h3><ul class="tl">'+last.log.map(function(l){ return '<li><span class="t">'+esc(l[0])+'</span><span>'+esc(l[1])+'</span></li>'; }).join('')+'</ul>'+
        ladderButtons(last)+'</section>'+

    }
    html += copyBox()+'<p class="note">Fictional people. In the real product, the OKA Care Agent in Copilot makes these decisions and a nurse confirms.</p>';
    $('screen').innerHTML = html;
    bindAll('[data-sel]', function(b){ S.sel=b.getAttribute('data-sel'); S.copyText=null; render(); });
    bindAll('[data-k]', function(b){ S.copyText=null; trigger(b.getAttribute('data-k')); });
    bindLadder();

    if ($('go-visitor')) $('go-visitor').onclick=function(){ setView('visitor'); };
    if ($('go-nurse')) $('go-nurse').onclick=function(){ setView('nurse'); };
  }
  function ladderButtons(a){
    if (a.closed) return '';
    if (a.route==='ladder') return '<div class="actions"><button type="button" class="btn ghost sm" data-lad="'+a.id+'|found">Key holder: he\'s up and OK</button><button type="button" class="btn red sm" data-lad="'+a.id+'|esc">Demo: '+esc(a.deadline)+', still no movement</button></div>';
    if (a.route==='check') return '<div class="actions"><button type="button" class="btn ghost sm" data-lad="'+a.id+'|found">'+(res(a.res).plans?'Daughter: "She\'s with me"':'Reached: forgot the band')+'</button><button type="button" class="btn plain sm" data-lad="'+a.id+'|esc">Demo: '+esc(a.deadline)+', no one reached</button></div>';
    return '';
  }
  function bindLadder(){ bindAll('[data-lad]', function(b){ var v=b.getAttribute('data-lad').split('|'); ladderResolve(byId(+v[0]), v[1]); }); }
  function bindAll(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(b){ b.onclick=function(){ fn(b); }; }); }

  // ---------- Visitor (postie) view ----------
  function rVisitor(){
    if (S.vscreen==='knock') return rKnock();
    if (S.vscreen==='note') return rNote();
    var reqs = knockOpen();
    header('Tuesday round', R.length+' OKA residents · '+reqs.length+' knock request'+(reqs.length===1?'':'s'));
    var html = '';
    if (reqs.length){
      html += '<h2 class="h2">Please knock</h2>'+reqs.map(function(a){ var r=res(a.res);
        return '<button type="button" class="card req'+(a.knockUrgent?' urgent':'')+'" data-req="'+a.id+'"><span class="row"><span class="name">'+esc(r.name)+'</span><span class="chip '+(a.knockUrgent?'red':'amber')+'">'+(a.knockUrgent?'As soon as you can':'On your round')+'</span></span><span class="muted">'+esc(r.addr)+'</span><span>Please knock and check '+esc(r.short)+' is OK. Report what you see.</span></button>'; }).join('');
    } else {
      html += '<section class="card"><span class="name">No knock requests</span><span class="muted">When the band spots something, a request appears here. Try a scenario in the Band view.</span></section>';
    }
    html += '<h2 class="h2">My round</h2>'+R.map(function(r){
      return '<button type="button" class="card" data-note="'+r.id+'"><span class="row"><span class="name">'+esc(r.name)+'</span><span class="chip todo">Band '+r.id+'</span></span><span class="muted">'+esc(r.addr)+'</span><span class="small">Noticed something? Tap to send a note.</span></button>'; }).join('');
    html += '<p class="note">Visitors only knock, look and report. Never go in, lift anyone or give medicine.</p>';
    $('screen').innerHTML = html;
    bindAll('[data-req]', function(b){ S.vcur=+b.getAttribute('data-req'); S.vscreen='knock'; render(); window.scrollTo(0,0); });
    bindAll('[data-note]', function(b){ S.vcur=b.getAttribute('data-note'); S.vtags=[]; S.vnote=''; S.vscreen='note'; render(); window.scrollTo(0,0); });
  }
  function rKnock(){
    var a = byId(S.vcur), r = res(a.res);
    header('Knock request', r.name+' · '+r.addr, function(){ S.vscreen='round'; render(); });
    $('screen').innerHTML =
      '<section class="card req'+(a.knockUrgent?' urgent':'')+'"><span class="name">Please knock at '+esc(r.addr)+'</span><span>Check '+esc(r.short)+' is OK and report what you see. Don\'t go in.</span><span class="muted small">Usually: '+esc(r.usual)+'.</span></section>'+
      '<h2 class="h2">What did you see?</h2>'+
      '<button type="button" class="btn ghost" id="v-fine">Seen, looks OK</button>'+
      '<button type="button" class="btn plain" id="v-worse">Seems worse than usual</button>'+
      '<button type="button" class="btn plain" id="v-none">No answer</button>'+
      '<button type="button" class="btn red" id="v-floor">On the floor, not responding: I\'m calling 999</button>'+
      '<p class="note">Emergency? Call 999 first, then report.</p>';
    $('v-fine').onclick=function(){ visitorReport(a,'fine'); };
    $('v-worse').onclick=function(){ visitorReport(a,'worse'); };
    $('v-none').onclick=function(){ visitorReport(a,'noanswer'); };
    $('v-floor').onclick=function(){ visitorReport(a,'floor'); };
  }
  var TAGS = [['slow','Slower than usual',1],['fall','Fall or hurt',2],['conf','Confused',2],['eat','Not eating',0],['cold','Home very cold',0],['scared','Seems scared',0]];
  function rNote(){
    var r = res(S.vcur);
    header('Send a note', r.name+' · '+r.addr, function(){ S.vscreen='round'; stopRec(); render(); });
    $('screen').innerHTML =
      '<button type="button" class="btn red" id="n-999">Emergency? Call 999 first</button>'+
      '<section class="card"><span class="name">'+esc(r.name)+'</span><span class="muted small">Usually: '+esc(r.usual)+'</span></section>'+
      '<button type="button" class="mic'+(S.rec?' rec':'')+'" id="n-mic" aria-label="'+(S.rec?'Stop recording':'Record a voice note')+'"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><path d="M12 18v4"></path></svg></button>'+
      '<p class="note" style="margin:0">'+(SR?'Tap and speak (20 seconds).':'Voice not available here: type instead.')+'</p>'+
      '<div class="tags">'+TAGS.map(function(t){ return '<button type="button" class="tag" data-tag="'+t[0]+'" aria-pressed="'+(S.vtags.indexOf(t[0])>=0)+'">'+esc(t[1])+'</button>'; }).join('')+'</div>'+
      '<label class="lbl" for="n-text">Note</label><textarea id="n-text" placeholder="What did you notice?">'+esc(S.vnote)+'</textarea>'+
      '<button type="button" class="btn primary" id="n-send">Send note</button>';
    $('n-999').onclick=function(){ var a=makeAlert(r,'sos'); a.signal='Visitor: emergency'; a.lines=['Visitor called 999 at '+a.time]; a.band='OKA OBSERVATION. Visitor at '+r.addr+': emergency, 999 called at '+a.time+'.'; S.alerts.unshift(a); S.vscreen='round'; render(); toast('999 logged. Stay with them if safe.'); };
    $('n-text').oninput=function(e){ S.vnote=e.target.value; };
    bindAll('[data-tag]', function(b){ var t=b.getAttribute('data-tag'), i=S.vtags.indexOf(t); if(i>=0) S.vtags.splice(i,1); else S.vtags.push(t); b.setAttribute('aria-pressed', String(i<0)); });
    $('n-mic').onclick=toggleRec;
    $('n-send').onclick=function(){ sendNote(r); };
  }
  function sendNote(r){
    var a = {id:++S.seq, res:r.id, k:'note', time:clock(0), why:[], score:0, log:[], knock:false, knockDone:true, closed:false};
    var t = (S.vnote||'').toLowerCase(), social=false, scared=S.vtags.indexOf('scared')>=0 || /scared|shout|money/.test(t);
    TAGS.forEach(function(g){ if (S.vtags.indexOf(g[0])>=0){ if (g[2]){ a.score+=g[2]; a.why.push(g[1]+' +'+g[2]); } else if (g[0]!=='scared') social=true; } });
    if (/fell|fall/.test(t) && S.vtags.indexOf('fall')<0){ a.score+=2; a.why.push('Fall +2'); }
    if (/confus/.test(t) && S.vtags.indexOf('conf')<0){ a.score+=2; a.why.push('Confused +2'); }
    if (/fridge|not eating|cold/.test(t)) social=true;
    if (a.score>0 && r.age>=85){ a.score+=1; a.why.push('Aged 85+ +1'); }
    a.signal='Visitor note'; a.lines=[S.vnote||'Quick tags: '+S.vtags.join(', ')];
    a.band='OKA OBSERVATION. Visitor at '+r.addr+', '+a.time+'. '+r.name+'. '+(S.vnote||'')+(S.vtags.length?' Tags: '+S.vtags.join(', ')+'.':'');
    if (a.score>=4) bookVisit(a);
    else if (a.score>=2){ a.level='amber'; a.route='call'; a.title='Nurse phone call today'; }
    else if (scared){ a.level='amber'; a.route='council'; a.title='Council safeguarding team'; }
    else if (social){ a.level='green'; a.route='council'; a.title='Council care team'; }
    else { a.level='green'; a.route='noted'; a.title='Noted, thank you'; }
    a.log.push([a.time,'Note from visitor'],[a.time,a.title]);
    S.alerts.unshift(a); S.last=a.id; S.vscreen='round'; stopRec(); render(); toast(a.title);
  }
  function toggleRec(){
    if (S.rec){ stopRec(); render(); return; }
    if (!SR){ toast('Voice not available here. Type the note instead.'); return; }
    try { recog = new SR(); } catch(e){ toast('Microphone not available'); return; }
    var base = S.vnote; recog.lang='en-GB'; recog.interimResults=true; recog.continuous=true;
    recog.onresult=function(e){ var s=''; for (var i=0;i<e.results.length;i++) s+=e.results[i][0].transcript+' '; S.vnote=(base?base+' ':'')+s.trim(); var n=$('n-text'); if(n) n.value=S.vnote; };
    recog.onerror=function(){ stopRec(); render(); toast('Microphone not available. Type the note instead.'); };
    recog.onend=function(){ S.rec=false; recog=null; render(); };
    S.rec=true; render();
    try { recog.start(); setTimeout(function(){ if (recog) try{ recog.stop(); }catch(e){} }, 20000); } catch(e){ S.rec=false; }
  }
  function stopRec(){ if (recog){ var x=recog; recog=null; try{ x.abort(); }catch(e){} } S.rec=false; }

  // ---------- Nurse view ----------
  var DONE = {home:'Visited: safe at home', hosp:'Visited: sent to hospital', callok:'Called: no visit needed', callvisit:'Called: book a visit', amb:'Ambulance attended', gp:'GP appointment booked', pick:'Picked up, safe at home'};
  function rNurse(){
    header('Today\'s queue', 'Elmside urgent community response team');
    var A = S.alerts, total = A.length;
    var c = {none:0, visitor:0, call:0, visit:0, gp:0, r999:0};
    A.forEach(function(a){
      if (a.route==='999') c.r999++;
      else if (a.route==='visit'||a.route==='review'||a.route==='pickup') c.visit++;
      else if (a.route==='call') c.call++;
      else if (a.route==='gp') c.gp++;
      else if (a.route==='check'||a.route==='ladder'||a.route==='watch') c.visitor++;
      else c.none++;
    });
    var rows = [['none','Handled without a nurse','green'],['visitor','Visitor or family check','muted'],['gp','Sent to the GP','blue'],['call','Nurse phone call','amber'],['visit','Visit or pick-up','amber'],['r999','999','red']];
    var sum = '<section class="card"><div class="row"><h2 class="h2">Today so far</h2><span class="muted">'+total+' alert'+(total===1?'':'s')+'</span></div>'+
      (total ? rows.map(function(x){ var n=c[x[0]], p=Math.round(n/total*100); return '<div class="frow"><span>'+x[1]+'</span><span class="fbar"><span class="ffill '+x[2]+'" style="width:'+p+'%"></span></span><span class="fnum">'+n+'</span></div>'; }).join('')
      : '<p class="muted" style="margin:0">No alerts yet. Go to the Band view and try a scenario.</p>')+
      '<div class="row muted small" style="border-top:1px solid var(--line);padding-top:8px"><span><b>'+S.slots+'</b> of 12 visit slots left</span><label class="switch" for="full"><span>Team full</span><input type="checkbox" id="full"'+(S.teamFull?' checked':'')+'></label></div></section>';
    var order = {'999':0,'ladder':1,'pickup':2,'review':3,'visit':4,'call':5,'gp':6};
    var queue = A.filter(function(a){ return order.hasOwnProperty(a.route) && !a.outcome; }).sort(function(x,y){ return order[x.route]-order[y.route]; });
    var done = A.filter(function(a){ return a.outcome; });
    var other = A.filter(function(a){ return !order.hasOwnProperty(a.route) && !a.outcome; });
    var q = queue.length ? queue.map(function(a){ var r=res(a.res);
      return '<article class="card"><div class="row"><span class="name">'+esc(r.name)+', '+r.age+'</span><span class="chip '+(a.level==='red'?'red':a.level==='blue'?'blue':'amber')+'">'+esc(a.title)+'</span></div>'+
        '<span class="muted small">'+esc(r.addr)+' · '+esc(a.signal)+' · '+esc(a.time)+'</span>'+
        '<ul class="ho">'+handover(a).map(function(h){ return '<li><b>'+h[0]+':</b> '+esc(h[1])+'</li>'; }).join('')+'</ul>'+
        (a.why.length&&a.score?'<span class="muted small">Score '+a.score+': '+esc(a.why.join(', '))+'</span>':'')+
        '<div class="actions">'+outcomeButtons(a)+'<button type="button" class="btn plain sm" data-copy="'+a.id+'">Copy for agent</button></div>'+
        ladderButtons(a)+
        '<span class="note" style="text-align:left">The agent suggests. The nurse decides.</span></article>'; }).join('')
      : '<div class="card"><span class="muted">Nothing needs the nurse team right now.</span></div>';
    var d = done.length ? '<section class="card"><h3>Done today</h3>'+done.map(function(a){ return '<div class="row small" style="border-top:1px solid var(--line);padding-top:6px"><span>'+esc(res(a.res).name)+'</span><span class="muted">'+esc(a.outcome)+'</span></div>'; }).join('')+'</section>' : '';
    var o = other.length ? '<section class="card"><h3>Handled without a nurse</h3>'+other.map(function(a){ return '<div class="row small" style="border-top:1px solid var(--line);padding-top:6px"><span>'+esc(res(a.res).name)+'</span><span class="muted">'+esc(a.title)+'</span></div>'; }).join('')+'</section>' : '';
    $('screen').innerHTML = copyBox()+'<div class="ngrid"><div class="ncol">'+sum+d+o+'</div><div class="ncol"><h2 class="h2">Needs the nurse team</h2>'+q+'</div></div><p class="note">Fictional data. Counts only, no estimated savings.</p>';
    $('full').onchange=function(e){ S.teamFull=e.target.checked; };
    bindAll('[data-copy]', function(b){ copyFor(byId(+b.getAttribute('data-copy'))); });
    bindAll('[data-out]', function(b){ var v=b.getAttribute('data-out').split('|'), a=byId(+v[0]);
      if (v[1]==='callvisit'){ bookVisit(a); a.log.push([clock(0),'Nurse call: '+a.title.toLowerCase()]); toast(a.title); }
      else { a.outcome = DONE[v[1]]; a.log.push([clock(0),'Nurse: '+a.outcome]); toast('Saved: '+a.outcome); }
      render(); });
    bindLadder();
  }
  function outcomeButtons(a){
    function b(code, main){ return '<button type="button" class="btn '+(main?'primary':'plain')+' sm" data-out="'+a.id+'|'+code+'">'+DONE[code]+'</button>'; }
    if (a.route==='visit'||a.route==='review') return b('home',true)+b('hosp');
    if (a.route==='call') return b('callok',true)+b('callvisit');
    if (a.route==='pickup') return b('pick',true)+b('hosp');
    if (a.route==='999') return b('amb',true);
    if (a.route==='gp') return b('gp',true);
    return '';
  }

  function setView(v){ stopRec(); S.view=v; S.copyText=null; if (v==='visitor') S.vscreen='round'; render(); window.scrollTo(0,0); }
  bindAll('[data-view]', function(b){ setView(b.getAttribute('data-view')); });
  render();
})();
</script>
</body></html>
