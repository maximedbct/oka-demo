<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#F2542D"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OKA"><meta name="apple-mobile-web-app-status-bar-style" content="default"><script>if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}</script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>OKA One Knock Away</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: product-style guided demo. Top bar with wordmark, step tracker, one actor screen, sticky Back/Next. White, one brand colour (OKA orange), Figtree. */
[hidden]{display:none!important}
:root{
  --bg:#FFFFFF; --soft:#F4F5F7; --soft2:#EBEDF0; --fg:#0B1622; --muted:#5D6874; --line:#E4E7EB;
  --brand:#F2542D; --brand-soft:#FFEEE8; --brand-ink:#B8391A; --on:#FFFFFF;
  --red:#D92D20; --red-soft:#FDECEA; --amber:#C2570C; --amber-soft:#FFF1E2; --green:#1E7B45; --green-soft:#E6F4EC; --blue:#1F4FC9; --blue-soft:#E8EEFC;
  --device:#0B1622; --font:'Figtree','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E13; --soft:#141A21; --soft2:#1C242D; --fg:#F2F4F7; --muted:#9AA5B1; --line:#232C36;
  --brand:#FF6A45; --brand-soft:#2E1710; --brand-ink:#FF9A80; --on:#FFFFFF;
  --red:#F04438; --red-soft:#2D1210; --amber:#F08A3A; --amber-soft:#2B1A0C; --green:#3CCB7F; --green-soft:#0F2619; --blue:#6E95F5; --blue-soft:#121C33;
  --device:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E13; --soft:#141A21; --soft2:#1C242D; --fg:#F2F4F7; --muted:#9AA5B1; --line:#232C36;
  --brand:#FF6A45; --brand-soft:#2E1710; --brand-ink:#FF9A80; --on:#FFFFFF;
  --red:#F04438; --red-soft:#2D1210; --amber:#F08A3A; --amber-soft:#2B1A0C; --green:#3CCB7F; --green-soft:#0F2619; --blue:#6E95F5; --blue-soft:#121C33;
  --device:#000000; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px 10px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.logo b{font-size:24px;font-weight:800;letter-spacing:-.04em;color:var(--fg);line-height:1}
.logo span{display:none}
.home{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
h1.title{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:14px 0 0;text-wrap:balance}
h1.title em{font-style:normal;color:var(--brand)}
h2.story{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0;text-wrap:balance}
.lead{font-size:17px;margin:0;color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;color:var(--brand);margin:0}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.role{background:var(--soft);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.3}
.role div{display:flex;flex-direction:column}
.ri{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.role b{font-size:15px;font-weight:700}
.role small{color:var(--muted);font-size:13px}
.stories{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.storybtn{display:flex;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 2px;cursor:pointer;width:100%}
.storybtn:hover b{color:var(--brand)}
.storybtn .num{width:40px;height:40px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--fg);flex-shrink:0}
.storybtn > span:nth-child(2){flex:1;min-width:0}
.storybtn b{display:block;font-size:16px;font-weight:700}
.storybtn span span{font-size:14px;color:var(--muted)}
.storybtn .chev{color:var(--muted);flex-shrink:0}
.stepper{display:flex;gap:4px}
.st{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.st::before{content:"";height:4px;border-radius:2px;background:var(--soft2)}
.st.done::before{background:var(--fg)}
.st.on::before{background:var(--brand)}
.st.on{color:var(--fg)}
.st .ri{display:none}
.time{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.who{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.who .ri{width:28px;height:28px;border-radius:8px;background:var(--fg);color:var(--bg);border:0}
.who .ri svg{width:16px;height:16px}
.say{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.35;margin:0}
.say small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:0}
.stage{background:var(--soft);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
/* band */
.wrist{position:relative;width:220px;height:116px;display:flex;align-items:center;justify-content:center}
.strap{position:absolute;inset:36px 4px;border-radius:14px;background:var(--soft2)}
.pod{position:relative;width:104px;height:104px;border-radius:30px;background:var(--device);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(11,22,34,.18)}
.pod .btnc{width:52px;height:52px;border-radius:999px;border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.pod .led{width:14px;height:14px;border-radius:999px;background:#2BD576;box-shadow:0 0 12px #2BD576}
.pod.alert .led{background:#FF4D3D;box-shadow:0 0 14px #FF4D3D;animation:blink .9s infinite}
.pod.alert{animation:buzz .35s infinite}
.pod.off .led{background:#6B7580;box-shadow:none}
@keyframes blink{50%{opacity:.2}}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.bubble{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;max-width:300px;text-align:center}
.press{font-size:14px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--green-soft);color:var(--green)}
.press.none{background:var(--red-soft);color:var(--red)}
.press.off{background:var(--soft2);color:var(--fg)}
/* bars */
.bars{width:100%;display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;align-items:center;font-size:14px}
.bar b{font-weight:700}
.bar .track{display:flex;flex-direction:column;gap:3px}
.bar .b{height:8px;border-radius:4px}
.bar .b.usual{background:var(--soft2)}
.bar .b.now{background:var(--brand)}
.bar .lab{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* OKA card */
.okacard{width:100%;display:flex;flex-direction:column;gap:12px}
.knows{background:var(--bg);border-radius:12px;padding:14px;font-size:15px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.knows b{font-size:13px;font-weight:700;color:var(--muted)}
.knows span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--brand);margin-right:10px;vertical-align:middle}
.decision{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line)}
.decision small{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}
.decision.red small{background:var(--red-soft);color:var(--red)}.decision.amber small{background:var(--amber-soft);color:var(--amber)}.decision.green small{background:var(--green-soft);color:var(--green)}.decision.blue small{background:var(--blue-soft);color:var(--blue)}
.decision b{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.decision span{font-size:14px;color:var(--muted)}
.why{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;font-variant-numeric:tabular-nums}
.why span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.twocol .decision b{font-size:16px}
/* phone */
.phone{width:100%;max-width:320px;border-radius:34px;border:9px solid var(--device);background:var(--soft);overflow:hidden;box-shadow:0 14px 40px rgba(11,22,34,.16)}
.ph-top{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg);color:var(--fg);font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
.ph-top .ri{width:24px;height:24px;border-radius:7px;background:var(--brand);color:var(--on);border:0}
.ph-top .ri svg{width:14px;height:14px}
.ph-body{padding:12px;display:flex;flex-direction:column;gap:8px}
.notif{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px;box-shadow:0 1px 3px rgba(11,22,34,.08)}
.notif b{font-size:15px;font-weight:700}
.notif .mut{font-size:12px;color:var(--muted);margin-top:4px}
.choice{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;font-weight:600;width:100%;padding:0 12px}
.choice.go{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.choice.stop{background:var(--bg);border-color:var(--red);color:var(--red)}
.choice[aria-pressed="true"]{box-shadow:0 0 0 3px var(--brand)}
.ho{margin:0;padding:10px 12px 10px 28px;font-size:13px;display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:12px}
/* end */
.endcard{background:var(--fg);color:var(--bg);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
.endcard h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.15}
.endcard p{margin:0;font-size:16px;opacity:.85}
.ticks{display:flex;flex-direction:column;gap:8px;margin:6px 0 0;padding:0;list-style:none;font-size:15px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{color:var(--brand)}
.nav{display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nb{flex:1;min-height:52px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer}
.nb.back{background:var(--bg);border:1px solid var(--line);flex:0 0 auto;padding:0 20px}
.nb.next{background:var(--fg);color:var(--bg)}
.nb:disabled{opacity:.3;cursor:not-allowed}
.small{font-size:14px;color:var(--muted)}
.linkish{align-self:flex-start;background:none;border:0;color:var(--brand-ink);font-weight:700;cursor:pointer;font-size:14px;min-height:44px;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 40px);z-index:20}
.note{font-size:12px;color:var(--muted);margin:0}
/* live mode */
.livecta{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--fg);color:var(--bg);border:0;border-radius:16px;padding:18px;cursor:pointer}
.livecta .ri{background:var(--brand);color:#fff;border:0}
.livecta b{display:block;font-size:17px;font-weight:700}
.livecta span span{font-size:14px;opacity:.75}
.livecta > span:nth-child(2){flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#2BD576;margin-right:6px;vertical-align:middle}
.steps3{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps3 li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.steps3 .n{width:26px;height:26px;border-radius:99px;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.steps3 li.on .n{background:var(--brand);color:#fff}
.alerts{display:flex;flex-direction:column;gap:8px;width:100%}
.alertbtn{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;width:100%}
.alertbtn b{display:block;font-size:15px}
.alertbtn span{color:var(--muted)}
.alertbtn[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:12px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px;cursor:pointer;padding:0 16px;flex:1;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.src{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.detail{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.detail b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.raw{width:100%;font-size:13px}
.raw summary{cursor:pointer;color:var(--muted);font-weight:600}
.raw pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 0}
@media (prefers-reduced-motion: reduce){.pod.alert,.pod.alert .led{animation:none}}
</style>

<div class="wrap">
  <div class="top">
    <button type="button" class="logo" id="logo" aria-label="OKA home">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21V4h10v17"></path><path d="M4 21h16"></path><circle cx="14" cy="12.5" r="0.9" fill="#fff"></circle></svg></span><b>oka</b><span>One Knock Away</span>
    </button>
    <button type="button" class="home" id="home" hidden>All stories</button>
  </div>
  <main id="screen" aria-live="polite"></main>
  <div class="nav" id="nav" hidden>
    <button type="button" class="nb back" id="back">Back</button>
    <button type="button" class="nb next" id="next">Next</button>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function(){
  var IC = {
    band:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="3"></rect><path d="M9 7V3h6v4M9 17v4h6v-4"></path></svg>',

    visitor:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 8l9 6 9-6"></path></svg>',
    nurse:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v5a4 4 0 0 0 8 0V3"></path><path d="M10 12v3a5 5 0 0 0 10 0v-2"></path><circle cx="20" cy="11" r="2"></circle></svg>',
    family:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M17 11a3 3 0 1 0 0-6M21 21v-2a4 4 0 0 0-3-3.9"></path></svg>',
    tick:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:3px"><path d="M20 6L9 17l-5-5"></path></svg>'
  };
  var ROLE = {band:'Band', oka:'OKA (AI)', visitor:'Visitor', nurse:'Nurse', family:'Family'};
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ri(r, cls){ return '<span class="ri '+r+(cls?' '+cls:'')+'">'+IC[r]+'</span>'; }
  function who(r, label){ return '<span class="who">'+ri(r)+esc(label||ROLE[r])+'</span>'; }
  var toastT=null; function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},3000); }

  // ---------- building blocks ----------
  function band(state, bubble, press){
    return '<div class="wrist" aria-hidden="true"><div class="strap"></div><div class="pod '+state+'"><div class="btnc"><span class="led"></span></div></div></div>'+
      (bubble?'<div class="bubble">'+esc(bubble)+'</div>':'')+(press?'<span class="press'+(press.cls?' '+press.cls:'')+'">'+esc(press.t)+'</span>':'');
  }
  function okaCard(knows, dec, whyList){
    return '<div class="okacard"><div class="knows"><b>What OKA knows about them</b>'+knows.map(function(k){return '<span>'+esc(k)+'</span>';}).join('')+'</div>'+
      '<div class="decision '+dec.lvl+'"><small>'+esc(dec.tag||({red:'Emergency',amber:'Act today',green:'No action',blue:'GP check'}[dec.lvl]))+'</small><b>'+esc(dec.t)+'</b>'+(dec.s?'<span>'+esc(dec.s)+'</span>':'')+'</div>'+
      (whyList?'<div class="why">'+whyList.map(function(w){return '<span>'+esc(w)+'</span>';}).join('')+'</div>':'')+'</div>';
  }
  function phone(role, title, body){ return '<div class="phone"><div class="ph-top '+role+'">'+ri(role)+esc(title)+'</div><div class="ph-body">'+body+'</div></div>'; }
  function notif(title, text, sub){ return '<div class="notif"><b>'+esc(title)+'</b><span>'+esc(text)+'</span>'+(sub?'<span class="mut">'+esc(sub)+'</span>':'')+'</div>'; }
  function choices(key, opts){
    var cur = S.ch[key];
    return opts.map(function(o){ return '<button type="button" class="choice '+(o.cls||'')+'" data-ch="'+key+'|'+o.v+'" aria-pressed="'+(cur===o.v)+'">'+esc(o.t)+'</button>'; }).join('')+
      (cur?'':'<p class="note">Tap an answer to continue</p>');
  }

  // ---------- stories ----------
  var STORIES = [
    {id:'fall', n:'1', title:'Mrs Patel falls, but says she\'s OK', teaser:'A fall at home. No ambulance, but nobody ignores it.', steps:[
      {r:'band', time:'07:42', say:'Mrs Patel, 84, falls in her kitchen. Her band vibrates, flashes red and a small speaker asks: "Are you OK?"', sub:'She presses the button once: "I\'m OK".',

  function parseAgent(txt){
    var out = {}, curK = null;

      var clean = line.replace(/\*\*|__|`/g,'').replace(/^\s*(#+|[-*•>]|\d+\.)\s*/,'').trim();
      var hit = null;
      LABELS.forEach(function(l){ if (!hit && clean.toUpperCase().indexOf(l)===0){ var rest = clean.slice(l.length); if (/^\s*(\([^)]*\))?\s*[:\-–]/.test(rest) || rest.trim()==='') hit = l; } });
      if (hit){
        if (hit==='MESSAGE FOR THE DOORSTEP APP') hit='MESSAGE FOR THE OKA APP';
        curK = hit;
        var rest = clean.slice(hit==='MESSAGE FOR THE OKA APP' && clean.toUpperCase().indexOf('DOORSTEP')>0 ? 'MESSAGE FOR THE DOORSTEP APP'.length : hit.length).replace(/^\s*(\([^)]*\))?\s*[:\-–]\s*/,'');
        out[curK] = rest ? [rest] : [];
      } else if (curK && clean){ out[curK].push(line.replace(/\*\*|__|`/g,'').trim().replace(/^[-*•]\s*/,'')); }
    });
    var get = function(k){ return (out[k]||[]).join(' ').trim(); };

    var action = route.replace(/^\s*(RED|AMBER|GREEN)\s*(\([^)]*\))?\s*[-–:]?\s*/i,'') || route;
    var msg = get('MESSAGE FOR THE OKA APP');
    var why = get('WHY');
    return { ok: !!route, lvl:lvl, action:action, who:get('WHO ACTS'), why:why,
      whyChips: why ? (why.match(/[^=;]*?\+\s*\d+|=\s*\d+/g) || [why]).map(function(x){return x.replace(/^[\s,;]+/,'').trim();}).filter(Boolean).slice(0,8) : [],
      change:get('CHANGE FROM USUAL'), alert:get('ALERT'),

      family:get('FAMILY OR KEY HOLDER'), flags:get('FLAGS') };

      '<button type="button" class="livecta" id="golive">'+ri('oka')+'<span><b>Try it with the real AI agent</b><span>Our OKA Care Agent in Microsoft Copilot makes the decision. The app shows it.</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>'+
      '<p class="eyebrow" style="margin-top:8px">Or follow a guided story</p>'+
      '<div class="stories">'+STORIES.map(function(s){ return '<button type="button" class="storybtn" data-story="'+s.id+'"><span class="num">'+s.n+'</span><span><b>'+esc(s.title)+'</b><span>'+esc(s.teaser)+'</span></span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>'; }).join('')+'</div>'+
      '<p class="note">Prototype with fictional people and services. DHSC / Microsoft AI Challenge, Group 5.</p>';
    $('golive').onclick=function(){ S.story='live'; render(); window.scrollTo(0,0); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-story]'), function(b){ b.onclick=function(){ S.story=b.getAttribute('data-story'); S.step=0; S.ch={}; render(); window.scrollTo(0,0); }; });
  }
  function role(r, t, s){ return '<div class="role">'+ri(r)+'<div><b>'+esc(t)+'</b><small>'+esc(s)+'</small></div></div>'; }
  function rEnd(st, steps){
    var e = st.end();
    var stepper = '<div class="stepper">'+steps.map(function(x){ return '<div class="st done">'+ri(x.r)+'<span>'+esc(ROLE[x.r])+'</span></div>'; }).join('')+'</div>';
    $('screen').innerHTML = '<h2 class="story">'+esc(st.title)+'</h2>'+stepper+
      '<div class="endcard"><h2>'+esc(e.t)+'</h2><p>'+esc(e.p)+'</p><ul class="ticks">'+e.l.map(function(l){ return '<li>'+IC.tick+'<span>'+esc(l)+'</span></li>'; }).join('')+'</ul></div>'+
      '<button type="button" class="linkish" id="again">Replay this story with other choices</button>';
    $('again').onclick=function(){ S.step=0; S.ch={}; render(); window.scrollTo(0,0); };
    $('back').disabled=false;
    var idx = STORIES.indexOf(st), nxt = STORIES[idx+1];
    $('next').disabled=false; $('next').textContent = nxt ? 'Next story' : 'All stories';
  }
  function copy(text){
    function fb(){ toast('Copy not available here. Select the text in the agent kit instead.'); }
    try { navigator.clipboard.writeText(text).then(function(){ toast('Copied. Paste it into the OKA Care Agent in Copilot.'); }, fb); } catch(e){ fb(); }
  }

  $('next').onclick = function(){
    var st=cur(), steps=visibleSteps(st);
    if (S.step >= steps.length){ var i=STORIES.indexOf(st), n=STORIES[i+1]; if (n){ S.story=n.id; S.step=0; S.ch={}; } else S.story=null; }
    else S.step++;
    render(); window.scrollTo(0,0);
  };
  $('back').onclick = function(){ if (S.step===0) S.story=null; else S.step--; render(); window.scrollTo(0,0); };
  $('home').onclick = $('logo').onclick = function(){ S.story=null; render(); window.scrollTo(0,0); };
  try { localStorage.removeItem('oka-demo'); } catch(e){}
  render();
})();
</script>
</body></html>
