<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* One linear demo: Alert -> AI agent (Copilot, copy/paste) -> Decision -> Visitor -> Nurse -> Result.
   Desktop: left = what's happening + controls, right = what people see. Mobile: stacked. */
[hidden]{display:none!important}
:root{
  --bg:#FFFFFF; --soft:#F4F5F7; --soft2:#E9ECEF; --fg:#0B1622; --muted:#5D6874; --line:#E2E6EA;
  --brand:#F2542D; --brand-soft:#FFEEE8; --brand-ink:#B8391A;
  --red:#D92D20; --red-soft:#FDECEA; --amber:#B4530A; --amber-soft:#FFF1E2; --green:#1E7B45; --green-soft:#E6F4EC; --blue:#1F4FC9; --blue-soft:#E8EEFC;
  --device:#0B1622; --font:'Figtree','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E13; --soft:#141A21; --soft2:#1F2731; --fg:#F2F4F7; --muted:#9AA5B1; --line:#26303B;
  --brand:#FF6A45; --brand-soft:#2E1710; --brand-ink:#FF9A80;
  --red:#F04438; --red-soft:#2D1210; --amber:#F08A3A; --amber-soft:#2B1A0C; --green:#3CCB7F; --green-soft:#0F2619; --blue:#6E95F5; --blue-soft:#121C33;
  --device:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E13; --soft:#141A21; --soft2:#1F2731; --fg:#F2F4F7; --muted:#9AA5B1; --line:#26303B;
  --brand:#FF6A45; --brand-soft:#2E1710; --brand-ink:#FF9A80;
  --red:#F04438; --red-soft:#2D1210; --amber:#F08A3A; --amber-soft:#2B1A0C; --green:#3CCB7F; --green-soft:#0F2619; --blue:#6E95F5; --blue-soft:#121C33;
  --device:#000000; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.logo b{font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ghost{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
/* progress */
.prog{display:flex;gap:4px;padding-block:6px 4px}
.pg{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.pg::before{content:"";height:4px;border-radius:2px;background:var(--soft2)}
.pg.done::before{background:var(--fg)} .pg.on::before{background:var(--brand)} .pg.on{color:var(--fg)}
.pg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;display:flex;flex-direction:column;gap:20px;padding-block:14px 20px}
.left,.right{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:13px;font-weight:700;color:var(--brand);margin:0}
h1{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--brand)}
h2{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
.lead{font-size:17px;color:var(--muted);margin:0;max-width:46ch}
.small{font-size:14px;color:var(--muted);margin:0}
.panel{background:var(--soft);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.card{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lab{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
/* home flow */
.flow{display:flex;flex-direction:column;gap:8px;width:100%}
.fbox{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fbox b{display:block;font-size:16px}
.fbox span span{font-size:14px;color:var(--muted)}
.fbox.ai{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.arrow{align-self:center;color:var(--muted);line-height:0}
.ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--soft);color:var(--fg)}
.ic.brand{background:var(--brand);color:#fff}
.big{min-height:54px;border-radius:12px;border:0;background:var(--fg);color:var(--bg);font-size:17px;font-weight:700;cursor:pointer;padding:0 24px;align-self:flex-start}
/* people picker */
.people{display:grid;grid-template-columns:1fr;gap:8px}
.pbtn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.pbtn .av{width:36px;height:36px;border-radius:99px;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.pbtn b{display:block;font-size:15px;line-height:1.25}
.pbtn span span{font-size:13px;color:var(--muted)}
.pbtn[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.pbtn[aria-pressed="true"] .av{background:var(--brand);color:#fff}
/* band */
.wrist{position:relative;width:220px;height:112px;display:flex;align-items:center;justify-content:center}
.strap{position:absolute;inset:34px 4px;border-radius:14px;background:var(--soft2)}
.pod{position:relative;width:100px;height:100px;border-radius:28px;background:var(--device);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(11,22,34,.18)}
.pod .btnc{width:50px;height:50px;border-radius:999px;border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.pod .led{width:14px;height:14px;border-radius:999px;background:#2BD576;box-shadow:0 0 12px #2BD576}
.pod.alert .led{background:#FF4D3D;box-shadow:0 0 14px #FF4D3D;animation:blink .9s infinite}
.pod.alert{animation:buzz .35s infinite}
.pod.off .led{background:#6B7580;box-shadow:none}
@keyframes blink{50%{opacity:.2}}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.event{font-size:20px;font-weight:700;text-align:center;margin:0;line-height:1.3;text-wrap:balance}
.bubble{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;text-align:center}
.tag{font-size:14px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--green-soft);color:var(--green);text-align:center}
.tag.bad{background:var(--red-soft);color:var(--red)} .tag.neutral{background:var(--soft2);color:var(--fg)}
.empty{color:var(--muted);font-size:15px;padding:40px 0;text-align:center}
/* agent step */
.todo{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:12px;align-items:flex-start}
.todo .n{width:28px;height:28px;border-radius:99px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;margin-top:8px}
.todo li > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);align-self:flex-start}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.done{background:var(--green-soft);color:var(--green);border-color:transparent}
textarea{width:100%;min-height:96px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;padding:10px 12px;resize:vertical}
.link{background:none;border:0;color:var(--brand-ink);font-weight:700;cursor:pointer;font-size:14px;padding:0;min-height:36px;align-self:flex-start;text-align:left}
.msg{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
.copilot{display:flex;gap:12px;align-items:center;width:100%;background:var(--bg);border:1px solid var(--brand);box-shadow:0 0 0 1px var(--brand);border-radius:12px;padding:12px 14px}
.copilot b{display:block;font-size:15px} .copilot span span{font-size:13px;color:var(--muted)}
/* decision */
.verdict{width:100%;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line)}
.pill{align-self:flex-start;font-size:13px;font-weight:800;padding:4px 10px;border-radius:7px;letter-spacing:.02em}
.red .pill{background:var(--red-soft);color:var(--red)} .amber .pill{background:var(--amber-soft);color:var(--amber)} .green .pill{background:var(--green-soft);color:var(--green)}
.verdict.red{border-color:var(--red)}
.actions{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.actions li{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:700;line-height:1.3}
.actions li i{width:22px;height:22px;border-radius:99px;background:var(--fg);color:var(--bg);font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.actions li.if{font-size:15px;color:var(--muted);font-weight:600}
.actions li.if i{background:var(--soft2);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.chips span{background:var(--soft);border-radius:6px;padding:3px 8px}
.chips span.total{background:var(--fg);color:var(--bg);font-weight:700}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
details.raw{width:100%;font-size:13px}
details.raw summary{cursor:pointer;color:var(--muted);font-weight:600}
details.raw pre{white-space:pre-wrap;font:inherit;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0;max-height:200px;overflow:auto}
.source{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);align-self:flex-start}
.source.ex{background:var(--soft2);color:var(--muted)}
/* phone */
.phone{width:100%;max-width:330px;border-radius:30px;border:8px solid var(--device);background:var(--soft);overflow:hidden;box-shadow:0 14px 40px rgba(11,22,34,.16)}
.ph-top{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
.ph-top .ic{width:24px;height:24px;border-radius:7px}
.ph-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.notif{background:var(--bg);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:3px;font-size:14px;box-shadow:0 1px 3px rgba(11,22,34,.08)}
.notif b{font-size:15px}
.notif .mut{font-size:12px;color:var(--muted)}
.choice{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;width:100%;padding:0 12px}
.choice.go{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.choice.stop{border-color:var(--red);color:var(--red)}
.choice[aria-pressed="true"]{box-shadow:0 0 0 3px var(--brand)}
.ho{margin:0;padding:10px 12px 10px 26px;font-size:13px;display:flex;flex-direction:column;gap:3px;background:var(--bg);border-radius:12px}
/* result */
.endcard{background:var(--fg);color:var(--bg);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;width:100%}
.endcard h2{color:var(--bg)}
.endcard p{margin:0;opacity:.85}
.tl{display:flex;flex-direction:column;gap:0;width:100%;margin:0;padding:0;list-style:none}
.tl li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.tl li:last-child{border-bottom:0}
.tl b{display:block;font-size:14px}
.tl span span{font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
/* nav */
.nav{display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nb{flex:1;min-height:50px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer}
.nb.back{background:var(--bg);border:1px solid var(--line);flex:0 0 auto;padding:0 20px}
.nb.next{background:var(--brand);color:#fff}
.nb:disabled{opacity:.35;cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 40px);z-index:20}
@media (min-width:880px){
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:56px;align-items:start;padding-top:18px}
  main.home{align-items:center;padding-top:30px}
  h1{font-size:52px}
  .people{grid-template-columns:1fr 1fr}
  textarea{min-height:72px}
  .phone .ho{font-size:12.5px;gap:1px;padding-block:8px}
  .phone .choice{min-height:38px}
  .phone .ph-body{gap:6px}
}
@media (prefers-reduced-motion: reduce){.pod.alert,.pod.alert .led{animation:none}}
</style>

<script>

    {id:'patel', av:'AP', name:'Mrs Patel, 84', line:'Falls in her kitchen', state:'alert', event:'Mrs Patel falls in her kitchen at 07:42.', bubble:'"Are you OK? Press once if you\'re fine."', tag:'She presses once: "I\'m OK"', tcls:'',
     alert:'BAND ALERT. Mrs Asha Patel (band DS-001). 07:42 fall detected. Person pressed "I\'m OK" after 40 seconds. Steps since 07:42: 35. Heart rate 96. Now 07:43.',

     ex:'ALERT: Band: fall detected 06:15, no response, no movement.\nROUTE: AMBER (urgent) - Fall ladder: phone Mr Okafor and key holder Joan Price now, Joan knocks. If still no movement at 06:30, RED - 999 now.\nWHO ACTS: OKA phones Mr Okafor and Joan Price (5 Mill Lane, has a key) now. Elmside UCR is told.\nWHY: No response and no movement after a fall = fall ladder step 4. No score needed.\nCHANGE FROM USUAL: Usually up by 6am. Hard of hearing, so he may not have heard the band.\nMESSAGE FOR THE OKA APP: Joan, please knock loudly at 3 Mill Lane now and check on Daniel. You have his key. If he is on the floor and not responding, call 999.\nHANDOVER FOR THE NURSE:\n- Situation: Fall at 06:15. No response, no movement.\n- Background: 79, lives alone, type 2 diabetes, hard of hearing.\n- Assessment: Injuries unknown. Time on the floor unknown.\n- Recommendation: Check for injuries and low blood sugar.\nFAMILY OR KEY HOLDER: Neighbour Joan Price (key holder).\nFLAGS: none'},
    {id:'nowak', av:'HN', name:'Mrs Nowak, 87', line:'Doing a bit less each day', state:'', event:'Nothing dramatic. Mrs Nowak just does less, two days in a row.', bubble:'Steps 600 (usual 4,500) · Sleep 11h (usual 7h)', tag:'Pills missed 2 days', tcls:'neutral',
     alert:'BAND ALERT. Mrs Halina Nowak (band DS-004). Steps yesterday 900, today 600 at 16:00. Slept 11 hours last night and 10.5 the night before. Medication reminder not acknowledged 2 days in a row.',
     ex:'ALERT: Band: fewer steps, more sleep and missed medication over 2 days.\nROUTE: AMBER - Nurse visit today\nWHO ACTS: Elmside UCR nurse visits today.\nWHY: Steps drop +2, Sleep change +1, Medication missed +1, Aged 85+ +1 = 5\nCHANGE FROM USUAL: Steps 600 today (usual 4,500). Slept 11 hours (usual 7).\nMESSAGE FOR THE OKA APP: No visitor needed.\nHANDOVER FOR THE NURSE:\n- Situation: Slow decline over 2 days.\n- Background: 87, lives alone, no memory problems recorded. Speaks Polish and some English.\n- Assessment: Fewer steps, more sleep, pills missed. Cause unknown.\n- Recommendation: Check why she missed her pills, and look for signs of infection.\nFAMILY OR KEY HOLDER: Son Marek Nowak may be told.\nFLAGS: translation may help'},
    {id:'hughes', av:'JH', name:'Mrs Hughes, 91', line:'Not wearing her band', state:'off', event:'No data from Mrs Hughes since 21:30 last night.', bubble:'Band not worn for 13 hours', tag:'No data', tcls:'neutral',
     alert:'BAND ALERT. Mrs June Hughes (band DS-003). Band not worn since 21:30 yesterday. Now 11:00. No data.',
     ex:'ALERT: Band not worn since 21:30 yesterday. No data.\nROUTE: AMBER - OKA visitor check\nWHO ACTS: Call daughter Carol first (Mrs Hughes often stays with her). If she is not there, the postie (~11:00) knocks. Deadline 12:00 because she is 91.\nWHY: Band not worn for 13 hours = visitor check. No nurse needed yet.\nCHANGE FROM USUAL: Usually at her window by 10am. Often forgets the band after a shower.\nMESSAGE FOR THE OKA APP: Please knock at Flat 4, Rose Court and check Mrs Hughes is OK. Report what you see.\nFAMILY OR KEY HOLDER: Daughter Carol Hughes.\nFLAGS: band not worn'},
    {id:'williams', av:'TW', name:'Mr Williams, 82', line:'Irregular heartbeat, feels fine', state:'alert', event:'Mr Williams\'s band spots an irregular heartbeat.', bubble:'"Are you feeling OK?"', tag:'He presses once: "I feel fine"', tcls:'',
     alert:'BAND ALERT. Mr Tom Williams (band DS-007). Irregular heart rhythm alert at 10:05. Steps today 3,200 by 11:00. He answered the check-in: "I feel fine."',
     ex:'ALERT: Band: new irregular heart rhythm at 10:05. He feels fine.\nROUTE: AMBER - GP within 2 days\nWHO ACTS: Elm Road Surgery books him in within 2 days.\nWHY: New irregular heart rhythm +2. No other signs, so GP route.\nCHANGE FROM USUAL: No known irregular heartbeat. Active as usual.\nMESSAGE FOR THE OKA APP: No visitor needed.\nFAMILY OR KEY HOLDER: Son Gareth Williams may be told.\nFLAGS: none'},
    {id:'price', av:'AP', name:'Mr Price, 89', line:'Same heartbeat alert', state:'alert', event:'Mr Price\'s band spots an irregular heartbeat too.', bubble:'"Are you feeling OK?"', tag:'He presses once: "I\'m fine"', tcls:'',
     alert:'BAND ALERT. Mr Arthur Price (band DS-010). Irregular heart rhythm alert at 09:00. Steps and sleep normal.',
     ex:'ALERT: Band: irregular heart rhythm at 09:00.\nROUTE: GREEN - Noted\nWHO ACTS: No one. Normal for him.\nWHY: Known atrial fibrillation in his record. Irregular rhythm alerts are expected = 0\nCHANGE FROM USUAL: Steps and sleep normal for him.\nMESSAGE FOR THE OKA APP: No visitor needed.\nFAMILY OR KEY HOLDER: No need to contact.\nFLAGS: none'},
    {id:'own', av:'+', name:'Your own alert', line:'Let the jury write one', state:'alert', event:'Write any alert the band could send.', bubble:'', tag:'', tcls:'', alert:'', ex:''}
  ];

  // ---------- reading the agent's answer ----------
  var LABELS = ['ALERT','ROUTE','WHO ACTS','WHY','CHANGE FROM USUAL','MESSAGE FOR THE OKA APP','MESSAGE FOR THE DOORSTEP APP','HANDOVER FOR THE NURSE','FAMILY OR KEY HOLDER','FLAGS'];
  function parseAgent(txt){
    var out = {}, curK = null;
    txt.replace(/\r/g,'').split('\n').forEach(function(line){
      var clean = line.replace(/\*\*|__|`/g,'').replace(/^\s*(#+|[-*•>]|\d+\.)\s*/,'').trim();
      var hit = null;
      LABELS.forEach(function(l){ if (!hit && clean.toUpperCase().indexOf(l)===0){ var rest = clean.slice(l.length); if (/^\s*(\([^)]*\))?\s*[:\-–]/.test(rest) || rest.trim()==='') hit = l; } });
      if (hit){
        var rest = clean.slice(hit.length).replace(/^\s*(\([^)]*\))?\s*[:\-–]\s*/,'');
        curK = hit==='MESSAGE FOR THE DOORSTEP APP' ? 'MESSAGE FOR THE OKA APP' : hit;
        out[curK] = rest ? [rest] : [];
      } else if (curK && clean){ out[curK].push(line.replace(/\*\*|__|`/g,'').trim().replace(/^[-*•]\s*/,'')); }
    });
    function get(k){ return (out[k]||[]).join(' ').trim(); }
    var route = get('ROUTE'), who = get('WHO ACTS');
    if (!route) return null;
    // level = the first colour word in the route line
    var lv = route.match(/\b(RED|AMBER|GREEN)\b/i), lvl = lv ? lv[1].toLowerCase() : 'amber';
    var urgent = /urgent/i.test(route);
    // plain-English actions
    var r = route.toLowerCase(), acts = [], ifs = [];
    var cond999 = /if[^.]*\b999\b/i.test(route) && lvl!=='red';
    if (/\b999\b/.test(r) && !cond999) acts.push('Call 999 now');
    if (/visitor|knock/.test(r) || (/knock/.test(who.toLowerCase()))) acts.push('Someone knocks on the door');
    if (/falls? pick-?up/.test(r)) acts.push('Falls team comes to help');
    if (/nurse visit/.test(r)) acts.push('A nurse visits today');
    if (/nurse (phone )?call|phone call/.test(r)) acts.push('A nurse calls today');
    if (/\bgp\b/.test(r)) acts.push('GP appointment within 2 days');
    if (/safeguarding/.test(r)) acts.push('Council safeguarding team, today');
    else if (/council/.test(r)) acts.push('Council care team');
    if (/\bwatch\b/.test(r)) acts.push('Keep an eye: the next visitor looks out');
    if (/noted|no action/.test(r) && !acts.length) acts.push('Nothing to do. Normal for them.');
    if (cond999) ifs.push('999 only if there is still no movement');
    if (!acts.length) acts.push(route.replace(/^\s*(RED|AMBER|GREEN)\s*(\([^)]*\))?\s*[-–:]?\s*/i,''));
    var why = get('WHY');
    var chips = (why.match(/[^=;.]*?\+\s*\d+/g) || []).map(function(x){ return x.replace(/^[\s,;]+/,'').trim(); });
    var tot = why.match(/=\s*(\d+)/);
    var msg = get('MESSAGE FOR THE OKA APP');
    return { lvl:lvl, urgent:urgent, acts:acts, ifs:ifs, route:route, who:who, why:why, chips:chips, total: tot?tot[1]:null,
      change:get('CHANGE FROM USUAL'), family:get('FAMILY OR KEY HOLDER'),
      msg: (!msg || /no visitor needed/i.test(msg)) ? '' : msg,
      handover:(out['HANDOVER FOR THE NURSE']||[]).filter(function(x){ return x && !/^\(?only for/i.test(x); }) };
  }

  // ---------- state ----------
  var S;
  function reset(){ S = {screen:'home', i:0, p:null, own:'', raw:'', example:false, copied:false, d:null, v:null, n:null}; }
  reset();
  function person(){ return PEOPLE.filter(function(x){ return x.id===S.p; })[0]; }
  function alertText(){ var p=person(); return !p ? '' : p.id==='own' ? S.own.trim() : p.alert; }
  function steps(){
    var st=[{k:'alert',l:'Alert'},{k:'agent',l:'AI agent'},{k:'decision',l:'Decision'}];
    if (S.d && S.d.msg) st.push({k:'visitor',l:'Visitor'});
    if (S.d && (S.d.handover.length || S.d.lvl==='red')) st.push({k:'nurse',l:'Nurse'});
    st.push({k:'result',l:'Result'});
    return st;
  }

  // ---------- screens ----------
  function render(){
    var home = S.screen==='home';
    $('restart').hidden = home; $('nav').hidden = home; $('prog').hidden = home;
    $('screen').className = home ? 'home' : 'step';
    if (home) return rHome();
    var st = steps(), k = st[S.i].k;
    $('prog').innerHTML = st.map(function(x,i){ return '<div class="pg'+(i===S.i?' on':i<S.i?' done':'')+'"><span>'+(i+1)+'. '+esc(x.l)+'</span></div>'; }).join('');
    var r = ({alert:rAlert, agent:rAgent, decision:rDecision, visitor:rVisitor, nurse:rNurse, result:rResult})[k]();
    $('screen').innerHTML = '<div class="left">'+r.left+'</div><div class="right">'+r.right+'</div>';
    if (r.bind) r.bind();
    $('back').disabled = false;
    $('next').disabled = !r.ok;
    $('next').textContent = r.next || 'Next';
  }

  function rHome(){
    $('screen').innerHTML =
      '<div class="left"><h1>Help is always <em>one knock away.</em></h1>'+
      '<p class="lead">A simple band for older people who live alone. When something looks wrong, our AI agent decides who should go and check, before it becomes a trip to hospital.</p>'+
      '<button type="button" class="big" id="start">Start the demo</button>'+
      '<p class="hint">Fictional people and services. DHSC / Microsoft AI Challenge, Group 5.</p></div>'+
      '<div class="right"><div class="flow">'+
        fbox('band','','The band','Worn on the wrist. Notices falls and changes.')+'<div class="arrow">'+IC.down+'</div>'+
        fbox('ai','ai','The OKA agent','Built in Microsoft Copilot. Decides who acts.')+'<div class="arrow">'+IC.down+'</div>'+
        fbox('door','','The right person','A visitor knocks, a nurse calls, or 999.')+
      '</div></div>';
    $('start').onclick = function(){ S.screen='flow'; S.i=0; render(); window.scrollTo(0,0); };
  }
  function fbox(ic, cls, t, s){ return '<div class="fbox '+cls+'"><span class="ic'+(cls?' brand':'')+'">'+IC[ic]+'</span><span><b>'+esc(t)+'</b><span>'+esc(s)+'</span></span></div>'; }

  function bandVisual(p){
    return '<div class="wrist" aria-hidden="true"><div class="strap"></div><div class="pod '+p.state+'"><div class="btnc"><span class="led"></span></div></div></div>'+
      (p.bubble?'<div class="bubble">'+esc(p.bubble)+'</div>':'')+(p.tag?'<span class="tag '+p.tcls+'">'+esc(p.tag)+'</span>':'');
  }

  function rAlert(){
    var p = person();
    var left = '<p class="eyebrow">Step 1 · The band</p><h2>Something happens at home.</h2>'+
      '<p class="small">Pick a person. Their band notices something and sends an alert.</p>'+
      '<div class="people">'+PEOPLE.map(function(x){ return '<button type="button" class="pbtn" data-p="'+x.id+'" aria-pressed="'+(S.p===x.id)+'"><span class="av">'+esc(x.av)+'</span><span><b>'+esc(x.name)+'</b><span>'+esc(x.line)+'</span></span></button>'; }).join('')+'</div>';
    var right;
    if (!p) right = '<div class="panel"><p class="empty">Pick a person to see what their band does.</p></div>';
    else if (p.id==='own') right = '<div class="panel"><p class="event">Write the alert the band sends.</p><textarea id="own" placeholder="BAND ALERT. Mr Kiran Shah (band DS-005). Steps today 800 by 15:00 ...">'+esc(S.own)+'</textarea><p class="hint">Residents DS-001 to DS-012 are in the agent\'s files.</p></div>';
    else right = '<div class="panel"><p class="event">'+esc(p.event)+'</p>'+bandVisual(p)+'</div>';
    return {left:left, right:right, ok: !!alertText(), bind:function(){
      each('[data-p]', function(b){ b.onclick=function(){ var id=b.getAttribute('data-p'); if (id!==S.p){ S.p=id; S.raw=''; S.d=null; S.copied=false; S.example=false; } render(); }; });
      if ($('own')) $('own').oninput=function(){ S.own=this.value; S.raw=''; S.d=null; $('next').disabled=!this.value.trim(); };
    }};
  }

  function rAgent(){
    var p = person();
    var left = '<p class="eyebrow">Step 2 · The AI agent</p><h2>OKA asks the AI agent what to do.</h2>'+
      '<p class="small">Our agent lives in Microsoft Copilot. It knows each person\'s normal and the rules. Today we pass the alert by copy and paste.</p>'+
      '<ol class="todo">'+
        '<li><span class="n">1</span><div><button type="button" class="btn '+(S.copied?'done':'dark')+'" id="copyA">'+(S.copied?'Alert copied':'Copy the alert')+'</button></div></li>'+
        '<li><span class="n">2</span><div><a class="btn" href="'+AGENT_URL+'" target="_blank" rel="noopener">Open the agent in Copilot '+IC.ext+'</a><span class="hint">Paste the alert, then copy the agent\'s whole answer.</span></div></li>'+
        '<li><span class="n">3</span><div><textarea id="ans" placeholder="Paste the agent\'s answer here">'+esc(S.raw)+'</textarea>'+
          (p && p.ex ? '<button type="button" class="link" id="useEx">No Copilot right now? Use an example answer</button>' : '')+'</div></li>'+
      '</ol>';
    var right = '<div class="panel"><span class="lab" style="align-self:flex-start">What the band sends</span><div class="msg">'+esc(alertText())+'</div>'+
      '<div class="arrow">'+IC.down+'</div>'+
      '<div class="copilot"><span class="ic brand">'+IC.ai+'</span><span><b>OKA Care Agent</b><span>Microsoft 365 Copilot · reads the person\'s file and the alert rules</span></span></div></div>';
    return {left:left, right:right, ok: !!S.raw.trim(), next:'See the decision', bind:function(){
      $('copyA').onclick=function(){ copy(alertText(), function(){ S.copied=true; render(); }); };
      $('ans').oninput=function(){ S.raw=this.value; S.example=false; $('next').disabled=!this.value.trim(); };
      if ($('useEx')) $('useEx').onclick=function(){ S.raw=person().ex; S.example=true; render(); };
    }};
  }

  function rDecision(){
    var d = S.d;
    var tag = d.lvl==='red' ? 'EMERGENCY' : d.lvl==='green' ? 'ALL FINE' : (d.urgent ? 'URGENT' : 'ACT TODAY');
    var left = '<p class="eyebrow">Step 3 · The decision</p><h2>The agent has decided.</h2>'+
      '<p class="small">This comes straight from the agent\'s answer. Nobody typed it into the app.</p>'+
      (S.example ? '<span class="source ex">Example answer in the agent\'s format</span>' : '<span class="source">'+IC.ai+'Answer from the OKA agent in Copilot</span>')+
      '<details class="raw"><summary>See the agent\'s full answer</summary><pre>'+esc(S.raw)+'</pre></details>';
    var right = '<div class="verdict '+d.lvl+'"><span class="pill">'+tag+'</span>'+
        '<ul class="actions">'+d.acts.map(function(a,i){ return '<li><i>'+(i+1)+'</i>'+esc(a)+'</li>'; }).join('')+d.ifs.map(function(a){ return '<li class="if"><i>!</i>'+esc(a)+'</li>'; }).join('')+'</ul>'+
        (d.who?'<div><span class="lab">Who</span><span class="clamp">'+esc(d.who)+'</span></div>':'')+
      '</div>'+
      '<div class="card"><span class="lab">Why</span>'+(d.chips.length ? '<div class="chips">'+d.chips.map(function(c){ return '<span>'+esc(c)+'</span>'; }).join('')+(d.total?'<span class="total">= '+esc(d.total)+' points</span>':'')+'</div>' : '<span class="clamp">'+esc(d.why||'Not given')+'</span>')+'</div>'+
      (d.change?'<div class="card"><span class="lab">What\'s different for them</span><span class="clamp">'+esc(d.change)+'</span></div>':'');
    return {left:left, right:right, ok:true};
  }

  function rVisitor(){
    var d = S.d;
    var left = '<p class="eyebrow">Step '+(S.i+1)+' · The visitor</p><h2>Someone knocks on the door.</h2>'+
      '<p class="small">A postie, carer or neighbour gets the agent\'s message on their phone. They only knock, look and report. No medical questions.</p>'+
      '<p class="hint">Tap what the visitor finds.</p>';
    var right = '<div class="panel">'+phone('visitor','OKA · Visitor', '<div class="notif"><b>Please knock</b><span>'+esc(d.msg)+'</span><span class="mut">Message written by the OKA agent</span></div>'+
      choices('v',[{v:'ok',t:'Seen: they look OK',c:'go'},{v:'none',t:'No answer'},{v:'floor',t:'On the floor: calling 999',c:'stop'}]))+'</div>';
    return {left:left, right:right, ok: !!S.v, bind:bindChoices};
  }

  function rNurse(){
    var d = S.d;
    var vis = S.v ? {ok:'Visitor: seen, looks OK',none:'Visitor: no answer at the door',floor:'Visitor: on the floor, 999 called'}[S.v] : '';
    var left = '<p class="eyebrow">Step '+(S.i+1)+' · The nurse</p><h2>The nurse already has the full picture.</h2>'+
      '<p class="small">The agent writes the handover, so the nurse doesn\'t start from scratch. A call takes minutes.</p>'+
      '<p class="hint">Tap what the nurse finds.</p>';
    var right = '<div class="panel">'+phone('nurse','OKA · Nurse team', '<div class="notif"><b>'+esc((person().id==='own'?'New case':person().name)+' · '+(d.acts.filter(function(a){ return /nurse|999|falls/i.test(a); })[0]||'Follow up today'))+'</b>'+(vis?'<span class="mut">'+esc(vis)+'</span>':'')+'</div>'+
      (d.handover.length?'<ul class="ho">'+d.handover.map(function(h){ var m=h.match(/^([^:]{2,22}):\s*(.*)$/); return '<li>'+(m?'<b>'+esc(m[1])+':</b> '+esc(m[2]):esc(h))+'</li>'; }).join('')+'</ul>':'')+
      choices('n',[{v:'ok',t:'Done: safe at home',c:'go'},{v:'hosp',t:'Needs hospital'}]))+'</div>';
    return {left:left, right:right, ok: !!S.n, bind:bindChoices};
  }

  function rResult(){
    var d = S.d, p = person();
    var home = S.n ? S.n==='ok' : S.v ? S.v==='ok' : true;
    var title = S.v==='floor' ? 'Found fast. Help on the way.' : d.lvl==='green' ? 'No false alarm.' : home ? 'They stay at home.' : 'The right help, fast.';
    var sub = S.v==='floor' ? 'Found within minutes, not hours later.' : d.lvl==='green' ? 'The agent knew this was normal for them. Nobody was disturbed.' : 'No needless ambulance, but nothing was ignored.';
    var tl = [['Band', p.id==='own'?'Sent the alert':p.event],['OKA agent (Copilot)', d.acts.join(' · ')]];
    if (d.msg) tl.push(['Visitor', {ok:'Knocked: they look OK',none:'Knocked: no answer',floor:'Found them on the floor and called 999'}[S.v]||'Knocked']);
    if (d.handover.length || d.lvl==='red') tl.push(['Nurse', S.n==='hosp'?'Sent them to hospital':'Checked: safe at home']);
    var left = '<p class="eyebrow">Result</p><div class="endcard"><h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p></div>'+
      '<p class="small">The decision came from our agent in Microsoft Copilot. In a real service, Power Automate would pass alerts and answers automatically.</p>';
    var right = '<div class="panel"><span class="lab" style="align-self:flex-start">What happened</span><ul class="tl">'+tl.map(function(x){ return '<li><span><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></span></li>'; }).join('')+'</ul></div>';
    return {left:left, right:right, ok:true, next:'Try another person'};
  }

  function phone(role, title, body){ return '<div class="phone"><div class="ph-top"><span class="ic brand">'+IC[role]+'</span>'+esc(title)+'</div><div class="ph-body">'+body+'</div></div>'; }
  function choices(key, opts){ return opts.map(function(o){ return '<button type="button" class="choice '+(o.c||'')+'" data-c="'+key+'|'+o.v+'" aria-pressed="'+(S[key]===o.v)+'">'+esc(o.t)+'</button>'; }).join(''); }
  function bindChoices(){ each('[data-c]', function(b){ b.onclick=function(){ var v=b.getAttribute('data-c').split('|'); S[v[0]]=v[1]; render(); }; }); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function copy(text, ok){
    function fb(){ toast('Copy blocked here. Select the alert text and copy it by hand.'); }
    try { navigator.clipboard.writeText(text).then(function(){ toast('Copied. Paste it into the OKA agent in Copilot.'); if (ok) ok(); }, fb); } catch(e){ fb(); }
  }

  // ---------- nav ----------
  $('next').onclick = function(){
    var st = steps(), k = st[S.i].k;
    if (k==='agent'){
      var d = parseAgent(S.raw);
      if (!d){ toast('That doesn\'t look like the agent\'s answer. Copy all of it, including ROUTE.'); return; }
      S.d = d; S.v = null; S.n = null;
    }
    if (k==='result'){ var keep = S.p; reset(); S.screen='flow'; render(); window.scrollTo(0,0); return; }
    S.i++; render(); window.scrollTo(0,0);
  };
  $('back').onclick = function(){ if (S.i===0){ S.screen='home'; } else S.i--; render(); window.scrollTo(0,0); };
  $('restart').onclick = $('logo').onclick = function(){ reset(); render(); window.scrollTo(0,0); };
  try { localStorage.removeItem('oka-demo'); } catch(e){}
  render();
})();
</script>
</body></html>
